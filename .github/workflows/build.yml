name: Build EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: g++ -O2 -static main.cpp -o program.exe
      - uses: actions/upload-artifact@v4
        with:
          name: program-exe
          path: program.exe
